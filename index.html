/* =========================================================================

/* ---------- Ícones (SVG inline) ---------- */

function Icon({ name, size = 18, className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d={P[name] || P.dashboard} />
    </svg>
  );
}

/* ---------- Auth Context ---------- */
const AuthCtx = createContext(null);

function friendlyError(error) {
  const msg = error?.message || 'Erro inesperado.';
  if (/invalid login credentials/i.test(msg)) return 'E-mail ou senha inválidos.';
  if (/email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar.';
  if (/user already registered/i.test(msg)) return 'Este e-mail já está cadastrado.';
  if (/password should be at least/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/tempo esgotado/i.test(msg)) return msg;
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(msg))
    return 'Não foi possível conectar ao Supabase. Verifique a internet e se o projeto está ativo.';
  if (/jwt|apikey|unauthorized|invalid api key/i.test(msg))
    return 'Chave do Supabase inválida. Confirme a URL e a Publishable Key no topo do arquivo.';
  return msg;
}

// ✅ FIX: evita ficar preso em "Aguarde…" quando a rede/projeto está pendurado.
function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(message)), ms)
    ),
  ]);
}

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');

  async function loadProfile(id, authUser = null) {
    try {
      const { data, error: profileError } = await sb
        .from('usuarios')
        .select('*')
        .eq('id', id)
        .maybeSingle();

      if (profileError) throw profileError;

      if (data) {
        setUser(data);
        setError('');
        return data;
      }

      // Trigger creates this row on signup. Fallback prevents a blank screen.
      const fallback = {
        id,
        nome: authUser?.user_metadata?.nome || authUser?.email?.split('@')[0] || 'Usuário',
        email: authUser?.email || '',
        tipo: 'professor',
      };
      setUser(fallback);
      return fallback;
    } catch (e) {
      console.error('loadProfile', e);
      setError(friendlyError(e));
      const fallback = authUser ? {
        id,
        nome: authUser.user_metadata?.nome || authUser.email?.split('@')[0] || 'Usuário',
        email: authUser.email || '',
        tipo: 'professor',
      } : null;
      setUser(fallback);
      return fallback;
    }
  }

  useEffect(() => {
    let mounted = true;

    sb.auth.getSession()
      .then(async ({ data, error: sessionError }) => {
        if (sessionError) throw sessionError;
        if (!mounted) return;

        if (data.session?.user) {
          await loadProfile(data.session.user.id, data.session.user);
        } else {
          setUser(null);
        }
      })
      .catch((e) => {
        console.error('getSession', e);
        if (mounted) setError(friendlyError(e));
      })
      .finally(() => {
        if (mounted) setLoading(false);
      });

    const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
      if (!mounted) return;

      if (session?.user) {
        // Do not await a Supabase request inside onAuthStateChange.
        setTimeout(() => {
          if (mounted) loadProfile(session.user.id, session.user);
        }, 0);
      } else {
        setUser(null);
      }
    });

    return () => {
      mounted = false;
      sub?.subscription?.unsubscribe();
    };
  }, []);

  const api = {
    user,
    loading,
    error,

    // ✅ FIX: timeout de 15s em todas as chamadas de auth.
    async signIn(email, senha) {
      const { data, error } = await withTimeout(
        sb.auth.signInWithPassword({ email: email.trim(), password: senha }),
        15000,
        'Tempo esgotado ao conectar com o Supabase. Verifique sua internet e se o projeto está ativo.'
      );
      if (error) throw error;
      if (data?.user) loadProfile(data.user.id, data.user);
    },

    async signUp(nome, email, senha) {
      const { error } = await withTimeout(
        sb.auth.signUp({
          email: email.trim(),
          password: senha,
          options: { data: { nome: nome.trim() } },
        }),
        15000,
        'Tempo esgotado ao criar a conta. Verifique sua internet e se o projeto está ativo.'
      );
      if (error) throw error;
    },

    async reset(email) {
      const { error } = await withTimeout(
        sb.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: `${window.location.origin}${window.location.pathname}#/login`,
        }),
        15000,
        'Tempo esgotado ao enviar o e-mail de recuperação.'
      );
      if (error) throw error;
    },

    async signOut() {
      await sb.auth.signOut();
      setUser(null);
    },
  };

  return <AuthCtx.Provider value={api}>{children}</AuthCtx.Provider>;
}

const useAuth = () => useContext(AuthCtx);

/* ---------- Router (hash) ---------- */
function useRoute() {
  const [hash, setHash] = useState(window.location.hash || '#/dashboard');
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || '#/dashboard');
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  const path = hash.replace(/^#/, '') || '/dashboard';
  const [base, id] = path.split('/').filter(Boolean);
  return { path, base: '/' + (base || 'dashboard'), id };
}

/* ---------- Utils ---------- */
function fmtDate(s) { if (!s) return '—'; try { return new Date(s).toLocaleDateString('pt-BR'); } catch { return s; } }
function fmtDateTime(s) { if (!s) return '—'; try { return new Date(s).toLocaleString('pt-BR'); } catch { return s; } }

}

function Skeleton({ className = 'h-6 w-full' }) {
  return <div className={`skeleton rounded-lg ${className}`} />;
}

function Modal({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/40" onClick={onClose} />
      <div className="relative bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-xl fade-in">
        <div className="flex items-center justify-between p-5 border-b">
          <h3 className="text-lg font-semibold text-slate-800">{title}</h3>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100"><Icon name="close" size={18} /></button>
        </div>
        <div className="p-5 space-y-3">{children}</div>
        {footer && <div className="flex justify-end gap-2 p-4 border-t bg-slate-50 rounded-b-2xl">{footer}</div>}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <span className="text-sm text-slate-600">{label}</span>
      <div className="mt-1">{children}</div>
    </label>
  );
}
const inputCls = "w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent";

function Toast({ msg, tone = 'blue', onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3200); return () => clearTimeout(t); }, [onClose]);
  const tones = { blue:'bg-blue-600', green:'bg-emerald-600', red:'bg-rose-600', orange:'bg-orange-500' };
  return (
    <div className="fixed bottom-4 right-4 z-[100] fade-in">
      <div className={`${tones[tone]} text-white px-4 py-3 rounded-xl shadow-lg text-sm max-w-sm`}>
        {msg}
      </div>
    </div>
  );
}
function useToast() {
  const [toast, setToast] = useState(null);
  const show = (msg, tone = 'blue') => setToast({ msg, tone });
  const node = toast ? <Toast {...toast} onClose={() => setToast(null)} /> : null;
  return { show, node };
}

/* ---------- Supabase UI helpers ---------- */
function getErrorMessage(error) {
  return friendlyError(error);
}

function InlineError({ message }) {
  if (!message) return null;
  return (
    <div className="mb-4 rounded-xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm text-rose-700">
      {message}
    </div>

}

   ========================================================================= */
const MENU = [
  { to:'/dashboard', label:'Dashboard', icon:'dashboard' },
  { to:'/turmas', label:'Turmas', icon:'turmas' },
  { to:'/alunos', label:'Alunos', icon:'alunos' },

  { to:'/acoes', label:'Ações', icon:'acoes' },
  { to:'/reunioes', label:'Reuniões', icon:'reunioes' },
  { to:'/relatorios', label:'Relatórios', icon:'relatorios' },

function Sidebar({ onClose }) {

        })}

      <div className="p-4 border-t border-white/10">
        <div className="mb-3 flex items-center gap-2">

/* =========================================================================
   🔐 LOGIN
   ========================================================================= */
function Login() {
  const { signIn, signUp, reset, error: authError } = useAuth();
  const [mode, setMode] = useState('login');
  const [nome, setNome] = useState('');
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [msg, setMsg] = useState({ text:'', tone:'slate' });
  const [loading, setLoading] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setMsg({ text:'', tone:'slate' });
    setLoading(true);
    try {
      if (mode === 'login') {
        await signIn(email, senha);
        window.location.hash = '#/dashboard';
      } else if (mode === 'signup') {
        await signUp(nome, email, senha);
        setMsg({ text:'Cadastro realizado! Faça login.', tone:'green' });
        setMode('login');
      } else {
        await reset(email);
        setMsg({ text:'Link de recuperação enviado ao seu e-mail.', tone:'green' });
      }
    } catch (err) {
      setMsg({ text: friendlyError(err), tone:'red' });
    } finally { setLoading(false); }
  }
  const toneCls = { slate:'text-slate-600', green:'text-emerald-700', red:'text-rose-700' };

  return (
    <div className="min-h-screen grid md:grid-cols-2">
      <div className="hidden md:flex flex-col justify-between p-12 text-white"
           style={{ background: 'linear-gradient(135deg,#0f2447 0%,#1e3a8a 60%,#3b82f6 100%)' }}>
        <div>
          <h1 className="text-3xl font-bold">Conselho<span className="text-blue-300">360</span></h1>
          <p className="text-blue-100 mt-2">Acompanhamento, análise e melhoria da aprendizagem</p>
        </div>
        <div className="space-y-3 text-sm text-blue-100">
          <p>• Avaliação por período e turma</p>
          <p>• Registro de dificuldades e destaques</p>
          <p>• Encaminhamentos e acompanhamento</p>
          <p>• Reuniões do conselho de classe</p>
        </div>
        <p className="text-xs text-blue-200">© 2026 Conselho360</p>
      </div>

      <div className="flex items-center justify-center p-6">
        <form onSubmit={submit} className="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
          <h2 className="text-2xl font-semibold mb-1 text-slate-800">
            {mode === 'login' ? 'Entrar' : mode === 'signup' ? 'Criar conta' : 'Recuperar senha'}
          </h2>
          <p className="text-sm text-slate-500 mb-6">
            {mode === 'login' ? 'Acesse o painel pedagógico.' :
             mode === 'signup' ? 'Cadastre-se para começar.' : 'Informe seu e-mail.'}
          </p>

          {mode === 'signup' && (
            <div className="mb-3">
              <Field label="Nome"><input className={inputCls} value={nome} onChange={e => setNome(e.target.value)} required /></Field>
            </div>
          )}
          <div className="mb-3">
            <Field label="E-mail"><input type="email" className={inputCls} value={email} onChange={e => setEmail(e.target.value)} required /></Field>
          </div>
          {mode !== 'reset' && (
            <div className="mb-4">
              <Field label="Senha"><input type="password" className={inputCls} value={senha} onChange={e => setSenha(e.target.value)} required minLength={6} /></Field>
            </div>
          )}

          {authError && !msg.text && <p className="text-sm mb-3 text-rose-700">{authError}</p>}

           {msg.text && <p className={`text-sm mb-3 ${toneCls[msg.tone]}`}>{msg.text}</p>}

          <button disabled={loading}
            className="w-full bg-blue-700 hover:bg-blue-800 disabled:opacity-60 text-white py-2.5 rounded-lg font-medium transition">
            {loading ? 'Aguarde…' : mode === 'login' ? 'Entrar' : mode === 'signup' ? 'Cadastrar' : 'Enviar link'}
          </button>

          <div className="mt-4 flex justify-between text-sm">
            {mode !== 'login' && <button type="button" onClick={() => setMode('login')} className="text-blue-700 font-medium">Voltar</button>}
            {mode === 'login' && (
              <>
                <button type="button" onClick={() => setMode('signup')} className="text-blue-700 font-medium">Criar conta</button>
                <button type="button" onClick={() => setMode('reset')} className="text-slate-500">Esqueci a senha</button>
              </>
            )}
          </div>
        </form>
      </div>
    </div>
  );
}

function ChartCanvas({ type, data, options }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, { type, data, options });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, JSON.stringify(data), JSON.stringify(options)]);
  return <canvas ref={ref} />;
}

function Dashboard() {
  const { user } = useAuth();
  const { show, node } = useToast();
  const [loading, setLoading] = useState(true);
  const [stats, setStats] = useState({ turmas:0, alunos:0, avalPend:0, avalConc:0 });
  const [difData, setDifData] = useState([]);
  const [desData, setDesData] = useState([]);
  const [atencao, setAtencao] = useState([]);
  const [encAbertos, setEncAbertos] = useState([]);
  const [reunioes, setReunioes] = useState([]);

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    try {
      const results = await Promise.all([
        sb.from('turmas').select('id', { count:'exact', head:true }),
        sb.from('alunos').select('id', { count:'exact', head:true }),
        sb.from('avaliacoes').select('status'),
        sb.from('dificuldades').select('tipo,status'),
        sb.from('destaques').select('motivo'),
        sb.from('encaminhamentos').select('id,descricao,status,prazo,alunos(nome)').neq('status','resolvido').order('prazo',{ascending:true, nullsFirst:false}).limit(6),
        sb.from('reunioes').select('id,data,periodo,turmas(nome)').order('data',{ascending:false}).limit(5),
      ]);
      const firstError = results.find(r => r.error)?.error;
      if (firstError) throw firstError;
      const [t, a, av, d, de, enc, re] = results;
      setStats({
        turmas: t.count || 0,
        alunos: a.count || 0,
        avalPend: (av.data || []).filter(x => x.status === 'rascunho').length,
        avalConc: (av.data || []).filter(x => x.status && x.status !== 'rascunho').length,
      });
      const countBy = (arr, key) => {
        const m = {};
        arr.forEach(i => { m[i[key]] = (m[i[key]] || 0) + 1; });
        return Object.entries(m).map(([k, v]) => ({ label: k.replace(/_/g,' '), total: v }));
      };
      setDifData(countBy(d.data || [], 'tipo'));
      setDesData(countBy(de.data || [], 'motivo'));

      const { data: difs } = await sb.from('dificuldades')
        .select('aluno_id, tipo, descricao, status, alunos(nome)')
        .neq('status','resolvido').limit(8);
      setAtencao(difs || []);
      setEncAbertos(enc.data || []);
      setReunioes(re.data || []);
    } catch (e) { console.error(e); show(getErrorMessage(e), 'red'); }
    finally { setLoading(false); }
  }

  const palette = ['#1e3a8a','#3b82f6','#8b5cf6','#f97316','#ef4444','#10b981','#f59e0b'];
  const difChart = {
    labels: difData.map(d => d.label),
    datasets: [{ label:'Registros', data: difData.map(d => d.total), backgroundColor: palette, borderRadius: 8, maxBarThickness: 40 }],
  };
  const desChart = {
    labels: desData.map(d => d.label),
    datasets: [{ data: desData.map(d => d.total), backgroundColor: palette, borderWidth: 0 }],
  };

  return (
    <div className="space-y-6">
      {node}
      <header>
        <h1 className="text-2xl md:text-3xl font-semibold text-slate-800">
          Olá, {user?.nome?.split(' ')[0] || 'professor'} 👋
        </h1>
        <p className="text-slate-500">Visão geral do Conselho360</p>
      </header>

      {loading ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {[1,2,3,4].map(i => <Skeleton key={i} className="h-24" />)}
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <StatCard label="Turmas" value={stats.turmas} icon="turmas" tone="blue" />
          <StatCard label="Alunos" value={stats.alunos} icon="alunos" tone="green" />
          <StatCard label="Avaliações pendentes" value={stats.avalPend} icon="avaliacoes" tone="orange" />
          <StatCard label="Avaliações concluídas" value={stats.avalConc} icon="avaliacoes" tone="purple" />
        </div>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <section className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
          <h2 className="font-semibold mb-3 text-slate-800 flex items-center gap-2">
            <Icon name="chart" size={18} className="text-blue-700" /> Principais dificuldades
          </h2>
          {difData.length === 0
            ? <EmptyState title="Sem registros de dificuldades" icon="dificuldades" />
            : <div className="h-64"><ChartCanvas type="bar" data={difChart} options={{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }} /></div>}
        </section>

        <section className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
          <h2 className="font-semibold mb-3 text-slate-800 flex items-center gap-2">
            <Icon name="destaques" size={18} className="text-amber-500" /> Destaques positivos
          </h2>
          {desData.length === 0
            ? <EmptyState title="Sem destaques registrados" icon="destaques" />
            : <div className="h-64"><ChartCanvas type="doughnut" data={desChart} options={{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } } }} /></div>}
        </section>

        <section className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
          <h2 className="font-semibold mb-3 text-slate-800 flex items-center gap-2">
            <Icon name="dificuldades" size={18} className="text-rose-600" /> Alunos que precisam de atenção
          </h2>
          {atencao.length === 0
            ? <EmptyState title="Nenhum aluno em atenção" icon="check" />
            : (
              <ul className="divide-y divide-slate-100">
                {atencao.map((a, i) => (
                  <li key={i} className="py-3 flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <p className="font-medium text-slate-800 truncate">{a.alunos?.nome}</p>
                      <p className="text-xs text-slate-500 truncate capitalize">
                        {(a.tipo || '').replace(/_/g,' ')} — {a.descricao}
                      </p>
                    </div>
                    <StatusBadge status={a.status} />
                  </li>
                ))}
              </ul>
            )}
        </section>

        <section className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
          <h2 className="font-semibold mb-3 text-slate-800 flex items-center gap-2">
            <Icon name="encaminhamentos" size={18} className="text-orange-600" /> Encaminhamentos em aberto
          </h2>
          {encAbertos.length === 0
            ? <EmptyState title="Sem encaminhamentos pendentes" icon="check" />
            : (
              <ul className="divide-y divide-slate-100">
                {encAbertos.map(e => (
                  <li key={e.id} className="py-3 flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <p className="font-medium text-slate-800 truncate">{e.alunos?.nome}</p>
                      <p className="text-xs text-slate-500 truncate">{e.descricao}</p>
                    </div>
                    <StatusBadge status={e.status} />
                  </li>
                ))}
              </ul>
            )}
        </section>

        <section className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm lg:col-span-2">
          <h2 className="font-semibold mb-3 text-slate-800 flex items-center gap-2">
            <Icon name="reunioes" size={18} className="text-purple-600" /> Reuniões recentes
          </h2>
          {reunioes.length === 0
            ? <EmptyState title="Sem reuniões agendadas" />
            : (
              <ul className="divide-y divide-slate-100">
                {reunioes.map(r => (
                  <li key={r.id} className="py-3 flex justify-between text-sm">
                    <span className="font-medium text-slate-800">{r.turmas?.nome || 'Turma'} — {r.periodo}</span>
                    <span className="text-slate-500">{fmtDateTime(r.data)}</span>
                  </li>
                ))}
              </ul>
            )}
        </section>
      </div>
    </div>
  );
}

function Turmas() {
  const { user } = useAuth();
  const { show, node } = useToast();
  const [items, setItems] = useState([]);
  const [alunosCount, setAlunosCount] = useState({});
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ nome:'', ano:new Date().getFullYear().toString(), periodo:'Manhã' });
  const canEdit = user?.tipo === 'admin';

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    try {
      const [t, a] = await Promise.all([
        sb.from('turmas').select('*').order('nome'),
        sb.from('alunos').select('turma_id'),
      ]);
      setItems(t.data || []);
      const cnt = {};
      (a.data || []).forEach(x => { cnt[x.turma_id] = (cnt[x.turma_id] || 0) + 1; });
      setAlunosCount(cnt);
    } catch (e) { console.error(e); show(getErrorMessage(e), 'red'); }
    finally { setLoading(false); }
  }
  async function criar() {
    if (!form.nome) return;
    const { error } = await sb.from('turmas').insert({ ...form, nome: form.nome.trim(), ano: form.ano.trim() });
    if (error) return show(getErrorMessage(error), 'red');
    show('Turma criada!', 'green');
    setModal(false); setForm({ nome:'', ano:new Date().getFullYear().toString(), periodo:'Manhã' }); load();
  }
  async function excluir(id) {
    if (!confirm('Excluir esta turma? Alunos vinculados também serão removidos.')) return;
    const { error } = await sb.from('turmas').delete().eq('id', id);
    if (error) return show(getErrorMessage(error), 'red');
    show('Turma excluída.', 'orange'); load();
  }

  return (
    <div className="space-y-5">
      {node}
      <header className="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-semibold text-slate-800">Turmas</h1>
          <p className="text-slate-500 text-sm">{items.length} cadastradas</p>
        </div>
        {canEdit && (
          <button onClick={() => setModal(true)}
            className="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm">
            <Icon name="plus" size={16} /> Nova turma
          </button>
        )}
      </header>

      {loading ? (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {[1,2,3].map(i => <Skeleton key={i} className="h-32" />)}
        </div>
      ) : items.length === 0
        ? <EmptyState title="Nenhuma turma cadastrada" icon="turmas" description="Crie a primeira turma para começar." />
        : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {items.map(t => (
              <div key={t.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 hover:shadow-md transition">
                <div className="flex justify-between items-start">
                  <div>
                    <p className="text-lg font-semibold text-slate-800">{t.nome}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{t.ano} • {t.periodo}</p>
                  </div>
                  {canEdit && (
                    <button onClick={() => excluir(t.id)} className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50">
                      <Icon name="trash" size={16} />
                    </button>
                  )}
                </div>
                <div className="mt-4 flex items-center justify-between text-sm">
                  <span className="text-slate-500">{alunosCount[t.id] || 0} aluno(s)</span>
                  <a href={`#/turmas/${t.id}`} className="text-blue-700 font-medium flex items-center gap-1">
                    Abrir <Icon name="arrowRight" size={14} />
                  </a>
                </div>
              </div>
            ))}
          </div>
        )}

      <Modal open={modal} onClose={() => setModal(false)} title="Nova turma"
        footer={<>
          <button onClick={() => setModal(false)} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-700">Cancelar</button>
          <button onClick={criar} className="px-4 py-2 rounded-lg bg-blue-700 text-white">Salvar</button>
        </>}>
        <Field label="Nome"><input className={inputCls} value={form.nome} onChange={e => setForm({ ...form, nome:e.target.value })} /></Field>
        <Field label="Ano"><input className={inputCls} value={form.ano} onChange={e => setForm({ ...form, ano:e.target.value })} /></Field>
        <Field label="Período">
          <select className={inputCls} value={form.periodo} onChange={e => setForm({ ...form, periodo:e.target.value })}>
            <option>Manhã</option><option>Tarde</option><option>Noite</option><option>Integral</option>
          </select>
        </Field>
      </Modal>
    </div>
  );
}

function TurmaDetalhe({ id }) {
  const [turma, setTurma] = useState(null);
  const [alunos, setAlunos] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => { load(); }, [id]);
  async function load() {
    setLoading(true);
    const [t, a] = await Promise.all([
      sb.from('turmas').select('*').eq('id', id).maybeSingle(),
      sb.from('alunos').select('*').eq('turma_id', id).order('nome'),
    ]);
    if (t.error) throw t.error;
    if (a.error) throw a.error;
    setTurma(t.data); setAlunos(a.data || []); setLoading(false);
  }
  if (loading) return <Skeleton className="h-40" />;
  if (!turma) return <EmptyState title="Turma não encontrada" />;

  return (
    <div className="space-y-5">
      <a href="#/turmas" className="text-sm text-blue-700 inline-flex items-center gap-1"><Icon name="arrowRight" size={14} className="rotate-180" /> Voltar</a>
      <header>
        <h1 className="text-2xl font-semibold text-slate-800">{turma.nome}</h1>
        <p className="text-slate-500 text-sm">{turma.ano} • {turma.periodo}</p>
      </header>
      <section className="bg-white rounded-2xl border border-slate-100 shadow-sm">

              {alunos.map(a => (
                <li key={a.id} className="p-4 flex items-center justify-between">
                  <span className="font-medium text-slate-800">{a.nome}</span>
                  <a href={`#/alunos/${a.id}`} className="text-blue-700 text-sm">Abrir</a>
                </li>
              ))}
            </ul>
          )}
      </section>
    </div>
  );
}

    setLoading(true);
    try {
      const [a, t] = await Promise.all([
        sb.from('alunos').select('*, turmas(nome)').order('nome'),
        sb.from('turmas').select('*').order('nome'),
      ]);
      setItems(a.data || []); setTurmas(t.data || []);

    show('Aluno cadastrado!', 'green');

              <Icon name="plus" size={16} /> Novo aluno

        : filtrados.length === 0 ? <EmptyState title="Nenhum aluno encontrado" icon="alunos" />

          <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

                  <th className="text-left p-3">Nome</th>
                  <th className="text-left p-3">Turma</th>

              </thead>

                  <tr key={a.id} className="border-t border-slate-100 hover:bg-slate-50">
                    <td className="p-3 font-medium text-slate-800">{a.nome}</td>
                    <td className="p-3 text-slate-600">{a.turmas?.nome || '—'}</td>

                <li key={a.id} className="p-4">
                  <a href={`#/alunos/${a.id}`} className="block">

          <button onClick={criar} className="px-4 py-2 rounded-lg bg-blue-700 text-white">Salvar</button>
        </>}>
        <Field label="Nome"><input className={inputCls} value={form.nome} onChange={e => setForm({ ...form, nome:e.target.value })} /></Field>
        <Field label="Turma">
          <select className={inputCls} value={form.turma_id} onChange={e => setForm({ ...form, turma_id:e.target.value })}>
            <option value="">Selecione…</option>
            {turmas.map(t => <option key={t.id} value={t.id}>{t.nome}</option>)}
          </select>
        </Field>
      </Modal>
    </div>
  );
}

      sb.from('destaques').select('*').eq('aluno_id', id).order('created_at', { ascending:false }),
      sb.from('encaminhamentos').select('*').eq('aluno_id', id).order('created_at', { ascending:false }),
    ]);
    setAluno(a.data); setDificuldades(d.data || []); setDestaques(de.data || []); setEnc(e.data || []);
    setLoading(false);
  }
  if (loading) return <Skeleton className="h-40" />;
  if (!aluno) return <EmptyState title="Aluno não encontrado" />;

  return (
    <div className="space-y-5">
      <a href="#/alunos" className="text-sm text-blue-700 inline-flex items-center gap-1"><Icon name="arrowRight" size={14} className="rotate-180" /> Voltar</a>

      </header>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
          <h3 className="font-semibold text-rose-600 flex items-center gap-2 mb-3"><Icon name="dificuldades" size={16} /> Dificuldades</h3>
          {dificuldades.length === 0 ? <p className="text-sm text-slate-500">Nenhum registro</p>
            : <ul className="space-y-2 text-sm">{dificuldades.slice(0,4).map(d => (
              <li key={d.id} className="border-l-2 border-rose-200 pl-2">
                <p className="font-medium text-slate-800 capitalize">{(d.tipo || '').replace(/_/g,' ')}</p>
                <p className="text-xs text-slate-500">{d.descricao}</p>
              </li>))}</ul>}
        </div>
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
          <h3 className="font-semibold text-amber-500 flex items-center gap-2 mb-3"><Icon name="destaques" size={16} /> Destaques</h3>
          {destaques.length === 0 ? <p className="text-sm text-slate-500">Nenhum registro</p>
            : <ul className="space-y-2 text-sm">{destaques.slice(0,4).map(d => (
              <li key={d.id} className="border-l-2 border-amber-200 pl-2">
                <p className="font-medium text-slate-800 capitalize">{(d.motivo || '').replace(/_/g,' ')}</p>
                <p className="text-xs text-slate-500">{d.descricao}</p>
              </li>))}</ul>}
        </div>
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
          <h3 className="font-semibold text-orange-600 flex items-center gap-2 mb-3"><Icon name="encaminhamentos" size={16} /> Encaminhamentos</h3>
          {enc.length === 0 ? <p className="text-sm text-slate-500">Nenhum registro</p>

  return (
    <div className="space-y-5">

          <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

                <tr>
                  <th className="text-left p-3">Turma</th>
                  <th className="text-left p-3 hidden md:table-cell">Professor</th>
                  <th className="text-left p-3">Período</th>

                  <th className="text-left p-3 hidden md:table-cell">Criada</th>

function AvaliacaoNova() {
  const { user } = useAuth();
  const { show, node } = useToast();
  const [turmas, setTurmas] = useState([]);
  const [loading, setLoading] = useState(false);
  const [form, setForm] = useState({
    turma_id:'', periodo:'1º Período',
    aprendizagem:'', participacao:'', postura:'', frequencia:'', observacoes:'',
  });

  useEffect(() => {
    sb.from('turmas').select('*').order('nome').then(({ data, error }) => {
      if (error) show(getErrorMessage(error), 'red');
      setTurmas(data || []);
    });
  }, []);

  async function salvar(status) {
    if (!form.turma_id) return show('Selecione a turma.', 'orange');
    setLoading(true);
    const { error } = await sb.from('avaliacoes').insert({ ...form, professor_id: user.id, status });
    setLoading(false);
    if (error) return show(getErrorMessage(error), 'red');
    show('Avaliação salva!', 'green');
    setTimeout(() => { window.location.hash = '#/avaliacoes'; }, 700);
  }

  return (
    <div className="space-y-5">
      {node}
      <a href="#/avaliacoes" className="text-sm text-blue-700 inline-flex items-center gap-1"><Icon name="arrowRight" size={14} className="rotate-180" /> Voltar</a>
      <header>
        <h1 className="text-2xl font-semibold text-slate-800">Nova avaliação</h1>
        <p className="text-slate-500 text-sm">Preencha a ficha do período</p>
      </header>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-5">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <Field label="Período">
            <select className={inputCls} value={form.periodo} onChange={e => setForm({ ...form, periodo:e.target.value })}>
              <option>1º Período</option><option>2º Período</option><option>3º Período</option>
            </select>
          </Field>
          <Field label="Turma">
            <select className={inputCls} value={form.turma_id} onChange={e => setForm({ ...form, turma_id:e.target.value })}>
              <option value="">Selecione…</option>
              {turmas.map(t => <option key={t.id} value={t.id}>{t.nome}</option>)}
            </select>
          </Field>
          <Field label="Professor">
            <input className={`${inputCls} bg-slate-50`} value={user?.nome || ''} disabled />
          </Field>
        </div>

        <fieldset className="border-t border-slate-100 pt-4">
          <legend className="text-sm font-semibold text-slate-700 mb-2">Aprendizagem</legend>
          <textarea rows={3} className={inputCls} placeholder="Nível de aprendizagem, desempenho, conteúdos com dificuldade…"
            value={form.aprendizagem} onChange={e => setForm({ ...form, aprendizagem:e.target.value })} />
        </fieldset>

        <fieldset className="border-t border-slate-100 pt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <p className="text-sm font-semibold text-slate-700 mb-2">Participação</p>
            <textarea rows={3} className={inputCls} placeholder="Envolvimento, participação…"
              value={form.participacao} onChange={e => setForm({ ...form, participacao:e.target.value })} />
          </div>
          <div>
            <p className="text-sm font-semibold text-slate-700 mb-2">Postura</p>
            <textarea rows={3} className={inputCls} placeholder="Postura e responsabilidade…"
              value={form.postura} onChange={e => setForm({ ...form, postura:e.target.value })} />
          </div>
        </fieldset>

        <fieldset className="border-t border-slate-100 pt-4">
          <legend className="text-sm font-semibold text-slate-700 mb-2">Frequência</legend>
          <textarea rows={2} className={inputCls} placeholder="Assiduidade, faltas…"
            value={form.frequencia} onChange={e => setForm({ ...form, frequencia:e.target.value })} />
        </fieldset>

        <fieldset className="border-t border-slate-100 pt-4">
          <legend className="text-sm font-semibold text-slate-700 mb-2">Observações gerais</legend>
          <textarea rows={5} className={inputCls}
            value={form.observacoes} onChange={e => setForm({ ...form, observacoes:e.target.value })} />
        </fieldset>

        <div className="flex flex-wrap gap-3 justify-end pt-3 border-t border-slate-100">
          <button disabled={loading} onClick={() => salvar('rascunho')}
            className="px-4 py-2 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50">Salvar rascunho</button>
          <button disabled={loading} onClick={() => salvar('finalizada')}
            className="px-4 py-2 rounded-lg bg-blue-700 hover:bg-blue-800 text-white">Finalizar avaliação</button>
          <button disabled={loading} onClick={() => salvar('enviada')}
            className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white">Enviar ficha</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================

const TIPOS_DIF = ['aprendizagem','participacao','frequencia','comportamento','conteudo_especifico','apoio','outro'];
const STATUS_ITEM = ['pendente','em_acompanhamento','resolvido','encaminhado'];

function Dificuldades() {
  const { user } = useAuth();
  const { show, node } = useToast();
  const [items, setItems] = useState([]);
  const [alunos, setAlunos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({
    aluno_id:'', tipo:'aprendizagem', descricao:'', conteudo_relacionado:'',
    estrategia_realizada:'', observacoes:'', periodo:'1º Período', status:'pendente',
  });

  useEffect(() => { load(); }, []);
  async function load() {
    setLoading(true);
    try {
      const [d, a] = await Promise.all([
        sb.from('dificuldades').select('*, alunos(nome)').order('created_at', { ascending:false }),
        sb.from('alunos').select('id,nome').order('nome'),
      ]);
      setItems(d.data || []); setAlunos(a.data || []);
    } catch (e) { console.error(e); show(getErrorMessage(e), 'red'); }
    finally { setLoading(false); }
  }
  async function salvar() {
    if (!form.aluno_id || !form.descricao) return show('Preencha aluno e descrição', 'orange');
    const { error } = await sb.from('dificuldades').insert({ ...form, professor_id: user.id, descricao: form.descricao.trim(), conteudo_relacionado: form.conteudo_relacionado.trim() || null, estrategia_realizada: form.estrategia_realizada.trim() || null, observacoes: form.observacoes.trim() || null });
    if (error) return show(getErrorMessage(error), 'red');
    show('Dificuldade registrada!', 'green');
    setModal(false); load();
  }
  async function mudarStatus(id, status) {
    const { error } = await sb.from('dificuldades').update({ status }).eq('id', id);
    if (error) return show(getErrorMessage(error), 'red');
    show('Status atualizado.', 'blue');
    load();
  }

  return (
    <div className="space-y-5">
      {node}
      <header className="flex justify-between items-center">
        <div>
          <h1 className="text-2xl font-semibold text-slate-800">Dificuldades significativas</h1>
          <p className="text-sm text-slate-500">{items.length} registros</p>
        </div>
        <button onClick={() => setModal(true)}
          className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm">
          <Icon name="plus" size={16} /> Registrar
        </button>
      </header>

      {loading ? <Skeleton className="h-40" />
        : items.length === 0 ? <EmptyState title="Nenhuma dificuldade registrada" icon="dificuldades" />
        : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {items.map(d => (
              <div key={d.id} className="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
                <div className="flex justify-between items-start gap-2">
                  <div>
                    <p className="font-medium text-slate-800">{d.alunos?.nome || 'Aluno'}</p>
                    <p className="text-xs text-slate-500 capitalize">{(d.tipo || '').replace(/_/g,' ')} • {d.periodo}</p>
                  </div>
                  <select value={d.status} onChange={e => mudarStatus(d.id, e.target.value)}
                    className="text-xs border border-slate-200 rounded-lg px-2 py-1 bg-white">
                    {STATUS_ITEM.map(s => <option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
                  </select>
                </div>
                <p className="mt-3 text-sm text-slate-700">{d.descricao}</p>
                {d.estrategia_realizada && (
                  <p className="mt-2 text-xs text-slate-500"><strong>Estratégia:</strong> {d.estrategia_realizada}</p>
                )}
                <p className="mt-3 text-xs text-slate-400">{fmtDateTime(d.created_at)}</p>
              </div>
            ))}
          </div>
        )}

      <Modal open={modal} onClose={() => setModal(false)} title="Registrar dificuldade"
        footer={<>
          <button onClick={() => setModal(false)} className="px-4 py-2 rounded-lg border border-slate-200">Cancelar</button>
          <button onClick={salvar} className="px-4 py-2 rounded-lg bg-rose-600 text-white">Salvar</button>
        </>}>
        <Field label="Aluno">
          <select className={inputCls} value={form.aluno_id} onChange={e => setForm({ ...form, aluno_id:e.target.value })}>
            <option value="">Selecione…</option>
            {alunos.map(a => <option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Tipo">
            <select className={inputCls} value={form.tipo} onChange={e => setForm({ ...form, tipo:e.target.value })}>
              {TIPOS_DIF.map(t => <option key={t} value={t}>{t.replace(/_/g,' ')}</option>)}
            </select>
          </Field>
          <Field label="Período">
            <select className={inputCls} value={form.periodo} onChange={e => setForm({ ...form, periodo:e.target.value })}>
              <option>1º Período</option><option>2º Período</option><option>3º Período</option>
            </select>
          </Field>
        </div>
        <Field label="Descrição">
          <textarea rows={3} className={inputCls} value={form.descricao} onChange={e => setForm({ ...form, descricao:e.target.value })} />
        </Field>
        <Field label="Conteúdo relacionado">
          <input className={inputCls} value={form.conteudo_relacionado} onChange={e => setForm({ ...form, conteudo_relacionado:e.target.value })} />
        </Field>
        <Field label="Estratégias já realizadas">
          <textarea rows={2} className={inputCls} value={form.estrategia_realizada} onChange={e => setForm({ ...form, estrategia_realizada:e.target.value })} />
        </Field>
      </Modal>
    </div>
  );
}

        </button>
      </header>

      {loading ? <Skeleton className="h-40" />
        : items.length === 0 ? <EmptyState title="Nenhum encaminhamento" icon="encaminhamentos" />
        : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {items.map(e => (
              <div key={e.id} className="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">

                    <p className="font-medium text-slate-800">{e.alunos?.nome || 'Aluno'}</p>
                    <p className="text-xs text-slate-500">Prazo: {fmtDate(e.prazo)}</p>

                  <select value={e.status} onChange={ev => mudarStatus(e.id, ev.target.value)}

/* =========================================================================
   📈 RELATÓRIOS
   ========================================================================= */
function Relatorios() {
  const { show, node } = useToast();
  const [data, setData] = useState({ dificuldades:[], destaques:[], enc:[], acoes:[] });
  const [loading, setLoading] = useState(true);

  useEffect(() => { load(); }, []);
  async function load() {
    setLoading(true);
    try {
      const [d, de, e, a] = await Promise.all([
        sb.from('dificuldades').select('tipo,status,periodo'),
        sb.from('destaques').select('motivo,periodo'),
        sb.from('encaminhamentos').select('status'),
        sb.from('acoes').select('status'),
      ]);
      setData({
        dificuldades:d.data || [], destaques:de.data || [],
        enc:e.data || [], acoes:a.data || [],
      });
    } catch (err) { console.error(err); show(getErrorMessage(err), 'red'); }
    finally { setLoading(false); }
  }

  const groupBy = (arr, key) => {
    const m = {};
    arr.forEach(i => { const k = i[key]; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).map(([k, v]) => ({ label:k.replace(/_/g,' '), total:v }));
  };
  const palette = ['#1e3a8a','#3b82f6','#8b5cf6','#f97316','#ef4444','#10b981','#f59e0b'];

  const difPorPeriodo = {};
  data.dificuldades.forEach(d => {
    if (!difPorPeriodo[d.periodo]) difPorPeriodo[d.periodo] = 0;
    difPorPeriodo[d.periodo]++;
  });
  const lineData = {
    labels: Object.keys(difPorPeriodo),
    datasets: [{
      label:'Dificuldades por período',
      data: Object.values(difPorPeriodo),
      borderColor:'#1e3a8a', backgroundColor:'rgba(30,58,138,.1)', tension:.35, fill:true,
    }],
  };
  const stEnc = groupBy(data.enc, 'status');
  const stAcoes = groupBy(data.acoes, 'status');

  return (
    <div className="space-y-5">
      {node}
      <header>
        <h1 className="text-2xl font-semibold text-slate-800">Relatórios</h1>
        <p className="text-slate-500 text-sm">Indicadores pedagógicos consolidados</p>
      </header>

      {loading ? <Skeleton className="h-64" /> : (
        <>
          <section className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <h2 className="font-semibold mb-3 text-slate-800">Evolução de dificuldades ao longo dos períodos</h2>
            <div className="h-64">
              <ChartCanvas type="line" data={lineData} options={{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }} />
            </div>
          </section>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            <section className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
              <h2 className="font-semibold mb-3 text-slate-800">Encaminhamentos por status</h2>
              <div className="h-56">
                <ChartCanvas type="doughnut" data={{
                  labels: stEnc.map(s => s.label),
                  datasets: [{ data: stEnc.map(s => s.total), backgroundColor: palette, borderWidth: 0 }],
                }} options={{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } } }} />
              </div>
            </section>

            <section className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
              <h2 className="font-semibold mb-3 text-slate-800">Ações por status</h2>
              <div className="h-56">
                <ChartCanvas type="doughnut" data={{
                  labels: stAcoes.map(s => s.label),
                  datasets: [{ data: stAcoes.map(s => s.total), backgroundColor: palette, borderWidth: 0 }],
                }} options={{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } } }} />
              </div>
            </section>
          </div>
        </>
      )}
    </div>
  );
}

/* =========================================================================
   ⚙️  CONFIGURAÇÕES
   ========================================================================= */
function Configuracoes() {
  const [periodos, setPeriodos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ nome:'', data_inicio:'', data_fim:'' });
  const [connection, setConnection] = useState('checking');
  const { show, node } = useToast();

  useEffect(() => {
    load();
    checkConnection();
  }, []);

  async function checkConnection() {
    const { error } = await sb.from('periodos').select('id', { count:'exact', head:true });
    setConnection(error ? 'error' : 'ok');
  }

  async function load() {
    setLoading(true);
    try {
      const { data, error } = await sb.from('periodos').select('*').order('data_inicio');
      if (error) throw error;
      setPeriodos(data || []);
    } catch (e) { console.error(e); show(getErrorMessage(e), 'red'); }
    finally { setLoading(false); }
  }
  async function criar() {
    if (!form.nome) return;
    const { error } = await sb.from('periodos').insert({ ...form, nome: form.nome.trim(), data_inicio: form.data_inicio || null, data_fim: form.data_fim || null });
    if (error) return show(getErrorMessage(error), 'red');
    show('Período criado.', 'green');
    setForm({ nome:'', data_inicio:'', data_fim:'' }); load();
  }
  async function excluir(id) {
    if (!confirm('Excluir este período?')) return;
    const { error } = await sb.from('periodos').delete().eq('id', id);
    if (error) return show(getErrorMessage(error), 'red');
    show('Período excluído.', 'orange');
    load();
  }

  return (
    <div className="space-y-5">
      {node}
      <header>
        <h1 className="text-2xl font-semibold text-slate-800">Configurações</h1>
        <p className="text-slate-500 text-sm">Períodos letivos e dados globais</p>
      </header>

      <section className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <h2 className="font-semibold text-slate-800 mb-3">Períodos</h2>
        {loading ? <Skeleton className="h-20" /> : (
          <>
            <ul className="divide-y divide-slate-100 mb-4">
              {periodos.map(p => (
                <li key={p.id} className="py-3 flex items-center justify-between">
                  <div>
                    <p className="font-medium text-slate-800">{p.nome}</p>
                    <p className="text-xs text-slate-500">{fmtDate(p.data_inicio)} → {fmtDate(p.data_fim)}</p>
                  </div>
                  <button onClick={() => excluir(p.id)} className="text-rose-600 text-sm">Excluir</button>
                </li>
              ))}
              {periodos.length === 0 && <li className="py-3 text-sm text-slate-500">Nenhum período cadastrado.</li>}
            </ul>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <input className={inputCls} placeholder="Nome (ex: 1º Período)" value={form.nome} onChange={e => setForm({ ...form, nome:e.target.value })} />
              <input type="date" className={inputCls} value={form.data_inicio} onChange={e => setForm({ ...form, data_inicio:e.target.value })} />
              <input type="date" className={inputCls} value={form.data_fim} onChange={e => setForm({ ...form, data_fim:e.target.value })} />
            </div>
            <button onClick={criar} className="mt-3 bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm">
              Adicionar período
            </button>
          </>
        )}
      </section>

      <section className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <h2 className="font-semibold text-slate-800 mb-2">Conexão com Supabase</h2>
        <div className={`text-sm ${connection === 'ok' ? 'text-emerald-700' : connection === 'error' ? 'text-rose-700' : 'text-slate-500'}`}>
          {connection === 'ok' ? '● Conectado e autenticado no banco.' : connection === 'error' ? '● Não foi possível consultar o banco. Verifique URL, chave, sessão e RLS.' : '● Verificando conexão…'}
        </div>
      </section>

      <section className="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <h2 className="font-semibold text-slate-800 mb-2">Setup do Supabase</h2>
        <p className="text-sm text-slate-500 mb-3">
          O banco deste projeto já foi preparado. Se precisar recriar o ambiente, use o SQL completo entregue junto com o arquivo.
        </p>
        <details className="group">
          <summary className="cursor-pointer text-sm text-blue-700 font-medium">Ver SQL completo</summary>
          <pre className="mt-3 p-3 bg-slate-900 text-slate-100 text-xs rounded-lg overflow-x-auto whitespace-pre">{SQL_SETUP}</pre>
        </details>
      </section>
    </div>
  );
}

/* =========================================================================
   🚀 APP
   ========================================================================= */
function App() {
  const { user, loading } = useAuth();
  const { base, id } = useRoute();

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="w-10 h-10 border-4 border-blue-700 border-t-transparent rounded-full animate-spin mx-auto" />
          <p className="mt-3 text-sm text-slate-500">Carregando Conselho360…</p>
        </div>
      </div>
    );
  }

  if (!user) return <Login />;

  const route = (() => {
    switch (base) {
      case '/dashboard':       return <Dashboard />;
      case '/turmas':          return id ? <TurmaDetalhe id={id} /> : <Turmas />;
      case '/alunos':          return id ? <AlunoDetalhe id={id} /> : <Alunos />;
      case '/avaliacoes':      return id === 'nova' ? <AvaliacaoNova /> : <Avaliacoes />;
      case '/dificuldades':    return <Dificuldades />;
      case '/destaques':       return <Destaques />;
      case '/encaminhamentos': return <Encaminhamentos />;
      case '/acoes':           return <Acoes />;
      case '/reunioes':        return <Reunioes />;
      case '/relatorios':      return <Relatorios />;
      case '/usuarios':        return user.tipo === 'admin' ? <Usuarios /> : <NoAccess />;
      case '/configuracoes':   return user.tipo === 'admin' ? <Configuracoes /> : <NoAccess />;
      default:                 return <Dashboard />;
    }
  })();

  return <Layout>{route}</Layout>;
}

function NoAccess() {
  return (
    <div className="p-10 text-center">
      <p className="text-lg font-semibold text-slate-700">Acesso restrito</p>
      <p className="text-slate-500 text-sm mt-1">Seu perfil não tem permissão para acessar esta página.</p>
    </div>
  );
}

/* ---------- SQL para copiar ---------- */
const SQL_SETUP = `O SQL completo e seguro está no arquivo SQL entregue junto com esta aplicação. Não execute um SQL antigo desta tela sem revisar as policies RLS.`;

/* =========================================================================
   🔗 MOUNT
   ========================================================================= */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <AuthProvider>
    <App />
  </AuthProvider>
);
</script>
</body>
</html>
