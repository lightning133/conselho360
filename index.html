 menu:"M3 6h18M3 12h18M3 18h18", close:"M6 6l12 12M6 18L18 6", plus:"M12 5v14M5 12h14",
 search:"M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z", trash:"M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6",

const MENU = [
 ["/dashboard","Dashboard","dashboard"],["/turmas","Turmas","turmas"],["/alunos","Alunos","alunos"],

 ["/destaques","Destaques","destaques"],["/encaminhamentos","Encaminhamentos","encaminhamentos"],
 ["/acoes","Ações","acoes"],["/reunioes","Reuniões","reunioes"],["/relatorios","Relatórios","relatorios"]
];
const ADMIN_MENU = [["/usuarios","Usuários","usuarios"],["/configuracoes","Configurações","config"]];

function esc(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function icon(name,size=18,cls=""){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="${ICONS[name]||ICONS.dashboard}"/></svg>`;}
function dateBR(v){if(!v)return "—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleDateString("pt-BR");}
function dateTimeBR(v){if(!v)return "—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("pt-BR");}
function errText(e){
 const m=e?.message||"Erro inesperado.";
 if(/invalid login credentials/i.test(m))return"E-mail ou senha inválidos.";
 if(/email not confirmed/i.test(m))return"Confirme seu e-mail antes de entrar.";
 if(/user already registered/i.test(m))return"Este e-mail já está cadastrado.";
 if(/password should be at least/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
 if(/rate limit/i.test(m))return"O limite de envio de e-mails do Supabase foi atingido. Tente novamente mais tarde.";
 if(/failed to fetch|networkerror|load failed|network request failed/i.test(m))return"Não foi possível conectar ao Supabase. Verifique a internet e se o projeto está ativo.";
 if(/jwt|apikey|unauthorized|invalid api key/i.test(m))return"A chave do Supabase parece inválida.";
 return m;
}
function toast(msg,type="blue"){
 clearTimeout(toastTimer);
 const colors={blue:"bg-blue-600",green:"bg-emerald-600",red:"bg-rose-600",orange:"bg-orange-500"};
 const el=document.createElement("div");el.className="fixed bottom-4 right-4 z-[100] fade";
 el.innerHTML=`<div class="${colors[type]||colors.blue} text-white px-4 py-3 rounded-xl shadow-xl text-sm max-w-sm">${esc(msg)}</div>`;
 document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),3200);
}
function loading(text="Carregando…"){return `<div class="flex items-center justify-center p-12 text-slate-500 gap-3">${icon("chart",20,"spin")}<span>${esc(text)}</span></div>`;}
function empty(title,desc="",ico="dashboard"){return `<div class="p-10 text-center bg-white rounded-2xl border border-dashed border-slate-200">${icon(ico,32,"mx-auto text-slate-400")}<p class="mt-3 font-medium text-slate-700">${esc(title)}</p>${desc?`<p class="text-sm text-slate-500 mt-1">${esc(desc)}</p>`:""}</div>`;}
function badge(status){
 const map={pendente:"bg-amber-100 text-amber-800",em_acompanhamento:"bg-purple-100 text-purple-800",resolvido:"bg-emerald-100 text-emerald-800",encaminhado:"bg-orange-100 text-orange-800",rascunho:"bg-slate-100 text-slate-700",finalizada:"bg-blue-100 text-blue-800",enviada:"bg-emerald-100 text-emerald-800",ativo:"bg-emerald-100 text-emerald-800"};
 return `<span class="text-xs font-medium px-2 py-1 rounded-full whitespace-nowrap ${map[status]||"bg-slate-100 text-slate-700"}">${esc(String(status||"").replace(/_/g," "))}</span>`;
}
function input(label,name,value,type="text",extra=""){return `<label class="block"><span class="text-sm text-slate-600">${esc(label)}</span><input ${extra} name="${name}" type="${type}" value="${esc(value||"")}" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></label>`;}
function textarea(label,name,value,rows=3){return `<label class="block"><span class="text-sm text-slate-600">${esc(label)}</span><textarea name="${name}" rows="${rows}" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${esc(value||"")}</textarea></label>`;}
function selectField(label,name,options,value=""){return `<label class="block"><span class="text-sm text-slate-600">${esc(label)}</span><select name="${name}" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?"selected":""}>${esc(t)}</option>`).join("")}</select></label>`;}
function modal(title,body,id="modal"){return `<div id="${id}" class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-black/40" data-close="${id}"></div><div class="relative bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-xl fade"><div class="flex items-center justify-between p-5 border-b"><h3 class="text-lg font-semibold text-slate-800">${esc(title)}</h3><button class="p-1 rounded-lg hover:bg-slate-100" data-close="${id}">${icon("close")}</button></div><div class="p-5 space-y-3">${body}</div></div></div>`;}
function layout(content,active){
 const items=[...MENU,...(currentUser?.tipo==="admin"?ADMIN_MENU:[])];
 return `<div class="min-h-screen flex bg-slate-50">
 <aside id="sidebar" class="fixed md:sticky top-0 left-0 z-50 h-screen w-64 bg-[#0f2447] text-white flex flex-col transform -translate-x-full md:translate-x-0 transition-transform">
   <div class="p-5 border-b border-white/10"><h1 class="text-xl font-bold">Conselho<span class="text-blue-400">360</span></h1><p class="text-xs text-blue-200 mt-1">Acompanhamento e melhoria da aprendizagem</p></div>
   <nav class="flex-1 overflow-y-auto p-3 space-y-1">${items.map(([to,l,i])=>`<a href="#${to}" data-nav class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm ${active===to?"bg-blue-600 text-white shadow":"text-blue-100 hover:bg-white/10"}">${icon(i,18)}${esc(l)}</a>`).join("")}</nav>
   <div class="p-4 border-t border-white/10"><div class="mb-3 flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-semibold">${esc((currentUser?.nome||"?").charAt(0).toUpperCase())}</div><div class="min-w-0"><p class="text-sm font-medium truncate">${esc(currentUser?.nome||"Usuário")}</p><p class="text-xs text-blue-200 capitalize">${esc(currentUser?.tipo||"")}</p></div></div><button id="logout" class="w-full flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 rounded-lg py-2 text-sm">${icon("logout",16)}Sair</button></div>
 </aside>
 <main class="flex-1 min-w-0 md:ml-0"><header class="md:hidden flex items-center justify-between p-4 bg-white border-b sticky top-0 z-30"><button id="openMenu" class="p-1">${icon("menu")}</button><span class="font-semibold">Conselho<span class="text-blue-600">360</span></span><span class="w-6"></span></header><div class="p-4 md:p-8 max-w-7xl mx-auto fade">${content}</div></main></div>`;
}
function header(title,sub,action=""){return `<header class="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h1 class="text-2xl md:text-3xl font-semibold text-slate-800">${esc(title)}</h1>${sub?`<p class="text-slate-500 text-sm mt-1">${esc(sub)}</p>`:""}</div>${action}</header>`;}
function btn(text,cls="bg-blue-700 hover:bg-blue-800"){return `<button class="${cls} text-white px-4 py-2 rounded-lg text-sm font-medium">${esc(text)}</button>`}
function card(content,cls=""){return `<section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 ${cls}">${content}</section>`}

/* ============================================================
   AUTENTICAÇÃO
   ============================================================ */
async function loadProfile(u){
 if(!u)return null;
 try{
   const {data,error}=await sb.from("usuarios").select("*").eq("id",u.id).maybeSingle();
   if(!error&&data){currentUser=data;return data;}
 }catch(e){}
 currentUser={id:u.id,nome:u.user_metadata?.nome||u.email?.split("@")[0]||"Usuário",email:u.email||"",tipo:"professor"};
 return currentUser;
}
function loginPage(mode="login",message=""){
 const title=mode==="login"?"Entrar":mode==="signup"?"Criar conta":"Recuperar senha";
 const button=mode==="login"?"Entrar":mode==="signup"?"Cadastrar":"Enviar link";
 app.innerHTML=`<div class="min-h-screen grid md:grid-cols-2"><div class="hidden md:flex flex-col justify-between p-12 text-white" style="background:linear-gradient(135deg,#0f2447,#1e3a8a 60%,#3b82f6)"><div><h1 class="text-3xl font-bold">Conselho<span class="text-blue-300">360</span></h1><p class="text-blue-100 mt-2">Acompanhamento, análise e melhoria da aprendizagem</p></div><div class="space-y-3 text-sm text-blue-100"><p>• Avaliação por período e turma</p><p>• Registro de dificuldades e destaques</p><p>• Encaminhamentos e acompanhamento</p><p>• Reuniões do conselho de classe</p></div><p class="text-xs text-blue-200">© 2026 Conselho360</p></div><div class="flex items-center justify-center p-6"><form id="authForm" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-100"><h2 class="text-2xl font-semibold mb-1 text-slate-800">${title}</h2><p class="text-sm text-slate-500 mb-6">${mode==="login"?"Acesse o painel pedagógico.":mode==="signup"?"Cadastre-se para começar.":"Informe seu e-mail para receber o link."}</p>${message?`<div class="mb-4 p-3 rounded-lg bg-rose-50 text-rose-700 text-sm">${esc(message)}</div>`:""}${mode==="signup"?input("Nome","nome","","text","required"):""}${input("E-mail","email","","email","required")}${mode!=="reset"?input("Senha","senha","","password","required minlength='6'"):""}<button class="mt-4 w-full bg-blue-700 hover:bg-blue-800 text-white py-2.5 rounded-lg font-medium" id="authBtn">${button}</button><div class="mt-4 flex justify-between text-sm">${mode!=="login"?'<button type="button" data-mode="login" class="text-blue-700 font-medium">Voltar</button>':`<button type="button" data-mode="signup" class="text-blue-700 font-medium">Criar conta</button><button type="button" data-mode="reset" class="text-slate-500">Esqueci a senha</button>`}</div></form></div></div>`;
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>loginPage(b.dataset.mode));
 document.getElementById("authForm").onsubmit=async e=>{
   e.preventDefault();const f=new FormData(e.target),email=String(f.get("email")).trim(),senha=String(f.get("senha")||"");
   const b=document.getElementById("authBtn");b.disabled=true;b.textContent="Aguarde…";
   try{
    if(mode==="login"){
      const r=await sb.auth.signInWithPassword({email,password:senha});if(r.error)throw r.error;
      session=r.data.session;await loadProfile(r.data.user);location.hash="#/dashboard";
    }else if(mode==="signup"){
      const nome=String(f.get("nome")).trim();const r=await sb.auth.signUp({email,password:senha,options:{data:{nome}}});if(r.error)throw r.error;
      if(r.data.session){session=r.data.session;await loadProfile(r.data.user);location.hash="#/dashboard";}
      else loginPage("login","Cadastro realizado. Confirme o e-mail antes de entrar.");
    }else{
      const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;
      loginPage("login","Link de recuperação enviado para o e-mail informado.");
    }
   }catch(err){loginPage(mode,errText(err));}finally{b.disabled=false;}
 };
}
async function logout(){try{await sb.auth.signOut()}catch(e){}currentUser=null;session=null;location.hash="#/login";}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function dashboard(){
 let stats={turmas:0,alunos:0,pend:0,done:0},dif=[],des=[],attention=[],enc=[],meet=[];
 try{
  const [t,a,av,d,de,e,r]=await Promise.all([
   sb.from("turmas").select("id",{count:"exact",head:true}),
   sb.from("alunos").select("id",{count:"exact",head:true}),
   sb.from("avaliacoes").select("status"),
   sb.from("dificuldades").select("tipo,status"),
   sb.from("destaques").select("motivo"),
   sb.from("encaminhamentos").select("id,descricao,status,prazo,alunos(nome)").neq("status","resolvido").order("prazo",{ascending:true}).limit(6),
   sb.from("reunioes").select("id,data,periodo,turmas(nome)").order("data",{ascending:false}).limit(5)
  ]);
  if(t.error)throw t.error;if(a.error)throw a.error;
  stats={turmas:t.count||0,alunos:a.count||0,pend:(av.data||[]).filter(x=>x.status==="rascunho").length,done:(av.data||[]).filter(x=>x.status&&x.status!=="rascunho").length};
  const group=(arr,key)=>{const m={};(arr||[]).forEach(x=>m[x[key]||"Sem categoria"]=(m[x[key]||"Sem categoria"]||0)+1);return Object.entries(m)};
  dif=group(d.data,"tipo");des=group(de.data,"motivo");enc=e.data||[];meet=r.data||[];
  const q=await sb.from("dificuldades").select("tipo,descricao,status,alunos(nome)").neq("status","resolvido").limit(8);attention=q.data||[];
 }catch(e){toast(errText(e),"red");}
 const ids=["difChart","desChart"];
 app.innerHTML=layout(`${header(`Olá, ${currentUser?.nome?.split(" ")[0]||"professor"} 👋`,"Visão geral do Conselho360")}
 <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
 ${[["Turmas",stats.turmas,"turmas","blue"],["Alunos",stats.alunos,"alunos","green"],["Avaliações pendentes",stats.pend,"avaliacoes","orange"],["Avaliações concluídas",stats.done,"avaliacoes","purple"]].map(x=>`<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex items-center gap-4"><div class="p-3 rounded-xl bg-${x[3]==="green"?"emerald":x[3]}-50 text-${x[3]==="green"?"emerald":x[3]}-700">${icon(x[2],22)}</div><div><p class="text-sm text-slate-500">${x[0]}</p><p class="text-2xl font-semibold text-slate-800">${x[1]}</p></div></div>`).join("")}</div>
 <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">${card(`<h2 class="font-semibold mb-3">Principais dificuldades</h2>${dif.length?'<div class="h-64"><canvas id="difChart"></canvas></div>':empty("Sem registros de dificuldades","", "dificuldades")}`)}${card(`<h2 class="font-semibold mb-3">Destaques positivos</h2>${des.length?'<div class="h-64"><canvas id="desChart"></canvas></div>':empty("Sem destaques registrados","", "destaques")}`)}
 ${card(`<h2 class="font-semibold mb-3">Alunos que precisam de atenção</h2>${attention.length?`<ul class="divide-y divide-slate-100">${attention.map(a=>`<li class="py-3 flex justify-between gap-3"><div class="min-w-0"><p class="font-medium truncate">${esc(a.alunos?.nome||"Aluno")}</p><p class="text-xs text-slate-500 truncate">${esc((a.tipo||"").replace(/_/g," "))} — ${esc(a.descricao||"")}</p></div>${badge(a.status)}</li>`).join("")}</ul>`:empty("Nenhum aluno em atenção","", "check")}`)}
 ${card(`<h2 class="font-semibold mb-3">Encaminhamentos em aberto</h2>${enc.length?`<ul class="divide-y divide-slate-100">${enc.map(e=>`<li class="py-3 flex justify-between gap-3"><div><p class="font-medium">${esc(e.alunos?.nome||"Aluno")}</p><p class="text-xs text-slate-500 truncate">${esc(e.descricao||"")}</p></div>${badge(e.status)}</li>`).join("")}</ul>`:empty("Sem encaminhamentos pendentes","", "check")}`)}
 ${card(`<h2 class="font-semibold mb-3">Reuniões recentes</h2>${meet.length?`<ul class="divide-y divide-slate-100">${meet.map(r=>`<li class="py-3 flex justify-between gap-3 text-sm"><span class="font-medium">${esc(r.turmas?.nome||"Turma")} — ${esc(r.periodo||"")}</span><span class="text-slate-500">${dateTimeBR(r.data)}</span></li>`).join("")}</ul>`:empty("Sem reuniões agendadas")}`,"lg:col-span-2")}
 </div>`, "/dashboard");
 if(dif.length)new Chart(document.getElementById("difChart"),{type:"bar",data:{labels:dif.map(x=>String(x[0]).replace(/_/g," ")),datasets:[{data:dif.map(x=>x[1]),backgroundColor:["#1e3a8a","#3b82f6","#8b5cf6","#f97316","#ef4444"],borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
 if(des.length)new Chart(document.getElementById("desChart"),{type:"doughnut",data:{labels:des.map(x=>String(x[0]).replace(/_/g," ")),datasets:[{data:des.map(x=>x[1]),backgroundColor:["#f59e0b","#3b82f6","#10b981","#8b5cf6","#ef4444"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
}

/* ============================================================
   TURMAS
   ============================================================ */
async function turmas(){
 let items=[],counts={};
 try{
  const [t,a]=await Promise.all([sb.from("turmas").select("*").order("nome"),sb.from("alunos").select("turma_id")]);

 const can=["admin","pedagogo","direcao"].includes(currentUser?.tipo);
 app.innerHTML=layout(`${header("Reuniões do conselho",`${items.length} reuniões`,can?btn("＋ Nova","bg-purple-600 hover:bg-purple-700"):"")}<div class="space-y-3 mt-5">${items.length?items.map(r=>card(`<p class="font-semibold">${esc(r.turmas?.nome||"Turma")} — ${esc(r.periodo||"")}</p><p class="text-xs text-slate-500 mt-1">${dateTimeBR(r.data)}</p>${r.participantes?`<p class="mt-3 text-sm"><b>Participantes:</b> ${esc(r.participantes)}</p>`:""}${r.observacoes?`<p class="mt-2 text-sm text-slate-600">${esc(r.observacoes)}</p>`:""}${r.decisoes?`<div class="mt-3 p-3 bg-purple-50 rounded-lg text-sm"><b class="text-purple-700">Decisões</b><p class="mt-1">${esc(r.decisoes)}</p></div>`:""}`,"") .replace(/^<section/,"<div").replace(/<\/section>$/,"</div>")).join(""):empty("Nenhuma reunião registrada","", "reunioes")}</div>`, "/reunioes");
 if(can)document.querySelector("header button")?.addEventListener("click",()=>{app.insertAdjacentHTML("beforeend",modal("Nova reunião",`<form id="meetForm">${selectField("Turma","turma_id",[["","Selecione…"],...turmasList.map(t=>[t.id,t.nome])])}${input("Data","data","","datetime-local")}${selectField("Período","periodo",[["1º Período","1º Período"],["2º Período","2º Período"],["3º Período","3º Período"]],"1º Período")}${input("Participantes","participantes")}${textarea("Observações","observacoes","",3)}${textarea("Decisões","decisoes","",3)}<div class="flex justify-end"><button class="bg-purple-600 text-white px-4 py-2 rounded-lg">Salvar</button></div></form>`));bindClose();document.getElementById("meetForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await sb.from("reunioes").insert({turma_id:f.get("turma_id"),data:new Date(f.get("data")).toISOString(),periodo:f.get("periodo"),participantes:f.get("participantes"),observacoes:f.get("observacoes"),decisoes:f.get("decisoes")});if(r.error)toast(errText(r.error),"red");else{toast("Reunião criada!","green");document.getElementById("modal")?.remove();reunioes();}};});
}

/* ============================================================
   RELATÓRIOS
   ============================================================ */
async function relatorios(){
 let d=[],e=[],a=[];try{const [x,y,z]=await Promise.all([sb.from("dificuldades").select("tipo,status,periodo"),sb.from("encaminhamentos").select("status"),sb.from("acoes").select("status")]);if(x.error)throw x.error;d=x.data||[];e=y.data||[];a=z.data||[];}catch(err){toast(errText(err),"red");}
 const group=(arr,key)=>{const m={};arr.forEach(x=>m[x[key]||"Sem status"]=(m[x[key]||"Sem status"]||0)+1);return Object.entries(m);};
 const byPeriod=group(d,"periodo"),enc=group(e,"status"),acoesG=group(a,"status");
 app.innerHTML=layout(`${header("Relatórios","Indicadores pedagógicos consolidados")}
 <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5">${card(`<h2 class="font-semibold mb-3">Dificuldades por período</h2><div class="h-64"><canvas id="r1"></canvas></div>`)}${card(`<h2 class="font-semibold mb-3">Encaminhamentos por status</h2><div class="h-64"><canvas id="r2"></canvas></div>`)}${card(`<h2 class="font-semibold mb-3">Ações por status</h2><div class="h-64"><canvas id="r3"></canvas></div>`)}</div>`, "/relatorios");
 new Chart(document.getElementById("r1"),{type:"line",data:{labels:byPeriod.map(x=>x[0]),datasets:[{data:byPeriod.map(x=>x[1]),borderColor:"#1e3a8a",backgroundColor:"rgba(30,58,138,.1)",fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
 [["r2",enc],["r3",acoesG]].forEach(([id,g])=>new Chart(document.getElementById(id),{type:"doughnut",data:{labels:g.map(x=>String(x[0]).replace(/_/g," ")),datasets:[{data:g.map(x=>x[1]),backgroundColor:["#1e3a8a","#3b82f6","#8b5cf6","#f97316","#10b981"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}}));
}

/* ============================================================
   USUÁRIOS / CONFIGURAÇÕES
   ============================================================ */
async function usuarios(){
 let items=[];try{const r=await sb.from("usuarios").select("*").order("nome");if(r.error)throw r.error;items=r.data||[];}catch(e){toast(errText(e),"red");}
 app.innerHTML=layout(`${header("Usuários","Gerencie os perfis de acesso")}${card(`<table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="text-left p-3">Nome</th><th class="text-left p-3 hidden md:table-cell">E-mail</th><th class="text-left p-3">Perfil</th></tr></thead><tbody>${items.map(u=>`<tr class="border-t"><td class="p-3 font-medium">${esc(u.nome)}</td><td class="p-3 hidden md:table-cell">${esc(u.email)}</td><td class="p-3"><select data-user="${u.id}" class="text-xs border rounded-lg px-2 py-1">${["professor","pedagogo","direcao","admin"].map(t=>`<option ${u.tipo===t?"selected":""}>${t}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>`)}`, "/usuarios");
 document.querySelectorAll("[data-user]").forEach(s=>s.onchange=async()=>{const r=await sb.from("usuarios").update({tipo:s.value}).eq("id",s.dataset.user);if(r.error)toast(errText(r.error),"red");else toast("Perfil atualizado.","green");});
}
async function configuracoes(){
 let periods=[],ok=false;try{const r=await sb.from("periodos").select("*").order("data_inicio");if(r.error)throw r.error;periods=r.data||[];ok=true;}catch(e){toast(errText(e),"red");}
 app.innerHTML=layout(`${header("Configurações","Períodos letivos e conexão")}
 ${card(`<h2 class="font-semibold mb-3">Períodos</h2><ul class="divide-y">${periods.map(p=>`<li class="py-3 flex justify-between"><div><b>${esc(p.nome)}</b><p class="text-xs text-slate-500">${dateBR(p.data_inicio)} → ${dateBR(p.data_fim)}</p></div><button data-period="${p.id}" class="text-rose-600 text-sm">Excluir</button></li>`).join("")||'<li class="py-3 text-sm text-slate-500">Nenhum período cadastrado.</li>'}</ul><form id="periodForm" class="grid md:grid-cols-3 gap-3 mt-4">${input("Nome","nome")} ${input("Início","data_inicio","","date")} ${input("Fim","data_fim","","date")}<button class="md:col-span-3 w-fit bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">Adicionar período</button></form>`)}
 ${card(`<h2 class="font-semibold mb-2">Conexão com Supabase</h2><p class="text-sm ${ok?"text-emerald-700":"text-rose-700"}">${ok?"● Conectado ao banco.":"● Não foi possível consultar o banco. Verifique URL, chave, sessão e RLS."}</p>`)}
 ${card(`<h2 class="font-semibold mb-2">Informação</h2><p class="text-sm text-slate-500">Esta versão usa Supabase diretamente pelo navegador e não depende de React/Babel para iniciar a interface.</p>`)}`, "/configuracoes");
 document.getElementById("periodForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await sb.from("periodos").insert({nome:f.get("nome"),data_inicio:f.get("data_inicio")||null,data_fim:f.get("data_fim")||null});if(r.error)toast(errText(r.error),"red");else{toast("Período criado.","green");configuracoes();}};
 document.querySelectorAll("[data-period]").forEach(b=>b.onclick=async()=>{if(!confirm("Excluir este período?"))return;const r=await sb.from("periodos").delete().eq("id",b.dataset.period);if(r.error)toast(errText(r.error),"red");else{toast("Período excluído.","orange");configuracoes();}});
}

/* ============================================================
   ROTEADOR / EVENTOS
   ============================================================ */
function bindClose(){document.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>document.getElementById(x.dataset.close)?.remove());}
function bindLayout(){
 document.getElementById("logout")?.addEventListener("click",logout);
 document.getElementById("openMenu")?.addEventListener("click",()=>document.getElementById("sidebar")?.classList.remove("-translate-x-full"));
 document.querySelectorAll("[data-nav]").forEach(a=>a.addEventListener("click",()=>document.getElementById("sidebar")?.classList.add("-translate-x-full")));
}
async function route(){
 if(!sb){app.innerHTML="<div class='p-8 text-rose-700'>Supabase não carregou. Verifique sua conexão e recarregue a página.</div>";return;}
 if(!session){loginPage("login");return;}
 const raw=location.hash.replace(/^#/,"")||"/dashboard",parts=raw.split("/").filter(Boolean),base="/"+(parts[0]||"dashboard"),id=parts[1];
 try{
  if(base==="/dashboard")await dashboard();
  else if(base==="/turmas"&&id)await turmaDetail(id);
  else if(base==="/turmas")await turmas();
  else if(base==="/alunos"&&id)await alunoDetail(id);
  else if(base==="/alunos")await alunos();
  else if(base==="/avaliacoes"&&id==="nova")await avaliacaoNova();
  else if(base==="/avaliacoes")await avaliacoes();
  else if(base==="/dificuldades")await listWithStudents("dificuldades","Dificuldades significativas","Registros pedagógicos", "rose",null,"Registrar");
  else if(base==="/destaques")await listWithStudents("destaques","Destaques positivos","Registros pedagógicos", "amber",null,"Registrar");
  else if(base==="/encaminhamentos")await encaminhamentos();
  else if(base==="/acoes")await acoes();
  else if(base==="/reunioes")await reunioes();
  else if(base==="/relatorios")await relatorios();
  else if(base==="/usuarios"&&currentUser?.tipo==="admin")await usuarios();
  else if(base==="/configuracoes"&&currentUser?.tipo==="admin")await configuracoes();
  else location.hash="#/dashboard";
  bindLayout();
 }catch(e){console.error(e);app.innerHTML=layout(`${header("Erro inesperado","A página encontrou um problema.")}${card(`<p class="text-rose-700">${esc(errText(e))}</p><button onclick="route()" class="mt-4 bg-blue-700 text-white px-4 py-2 rounded-lg">Tentar novamente</button>`)}`,base);bindLayout();}
}

window.addEventListener("hashchange",route);
window.addEventListener("DOMContentLoaded",async()=>{
 if(!sb)return route();
 const {data}=await sb.auth.getSession();
 session=data.session;
 if(session)await loadProfile(session.user);
 if(!location.hash)location.hash=session?"#/dashboard":"#/login";
 else await route();
 sb.auth.onAuthStateChange(async(event,s)=>{session=s;if(s){await loadProfile(s.user);if(!location.hash||location.hash==="#/login")location.hash="#/dashboard";}else{currentUser=null;if(location.hash!=="#/login")location.hash="#/login";}});
});
</script>
